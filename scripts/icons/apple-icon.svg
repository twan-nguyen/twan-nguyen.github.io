<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The same pivot-table T as src/app/icon.svg, with the last cell of the stem lifted
       mid-drag. Full-bleed ground: iOS rounds the corners itself. -->
  <rect width="64" height="64" fill="#0f1319"/>
  <g transform="translate(32 32) scale(0.78) translate(-32 -32)">
    <g fill="#2a3340">
      <rect x="4" y="24" width="16" height="16" rx="2"/>
      <rect x="44" y="24" width="16" height="16" rx="2"/>
      <rect x="4" y="44" width="16" height="16" rx="2"/>
      <rect x="44" y="44" width="16" height="16" rx="2"/>
    </g>
    <g fill="#f5d39b">
      <rect x="4" y="4" width="16" height="16" rx="2"/>
      <rect x="24" y="4" width="16" height="16" rx="2"/>
      <rect x="44" y="4" width="16" height="16" rx="2"/>
      <rect x="24" y="24" width="16" height="16" rx="2"/>
    </g>
    <rect x="25" y="45" width="14" height="14" rx="2" fill="none" stroke="#f5d39b" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 2.5"/>
    <g transform="rotate(-10 41 55)">
      <rect x="35.5" y="49.5" width="16" height="16" rx="2" fill="#000" opacity="0.5"/>
      <rect x="33" y="47" width="16" height="16" rx="2" fill="#f0a860"/>
    </g>
  </g>
</svg>
